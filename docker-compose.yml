services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybercomp}
      POSTGRES_USER: ${POSTGRES_USER:-cybercomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybercomp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cybercomp}:${POSTGRES_PASSWORD:-cybercomp}@db:5432/${POSTGRES_DB:-cybercomp}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      OFFICER_PASSWORD: ${OFFICER_PASSWORD:-Demo@2026}
      DEMO_MODE: ${DEMO_MODE:-true}
      EIMZO_DEMO_PIN: ${EIMZO_DEMO_PIN:-123456}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_ON_STARTUP: "false"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
